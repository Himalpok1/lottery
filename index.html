<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lottery Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --t1:#4FA3D1;--t2:#6BBF59;--t3:#E0913A;--t5:#D9534F;--t10:#8E6FCF;
  --t20:#E8C46A;--t30:#2FB6A8;--t50:#E05C9E;--t100:#C6CDDA;--tx:#7A8497;
  --display:'Archivo Black',Impact,'Arial Black',sans-serif;
  --body:'Archivo',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --cols:5;--cell:calc(100vw / var(--cols));
  /* themed at runtime */
  --bg:#12141C;--bg2:#1B2030;--panel:#1F2431;--panel2:#262C3B;
  --line:#2E3547;--line2:#3B4459;--text:#F2F1EC;--mute:#8E97AA;--mute2:#5C6579;--accent:#E8C46A;
  /* board surfaces — swapped for light themes */
  --tile:rgba(255,255,255,.055);--tileBd:rgba(255,255,255,.12);--barBg:rgba(0,0,0,.35);
  --railBg:rgba(0,0,0,.35);--chipBg:#fff;--chipInk:#14161C;--slotBg:#fff;--slotInk:#14161C;
  --footBg:#fff;--footInk:#14161C;--scrim:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.72));
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);overflow:hidden}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* ============ TV BOARD ============ */
#board{position:relative;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#bgLayer{position:absolute;inset:0;z-index:0;overflow:hidden;background:linear-gradient(160deg,var(--bg),var(--bg2))}
#bgLayer img,#bgLayer video{width:100%;height:100%;object-fit:cover;display:block}
#bgScrim{position:absolute;inset:0;background:var(--scrim);z-index:1}
#board>*{position:relative;z-index:2}

.bar{display:flex;align-items:center;gap:calc(var(--cell)*.05);padding:calc(var(--cell)*.035) calc(var(--cell)*.06);
  border-bottom:2px solid var(--tileBd);background:var(--barBg);flex:0 0 auto;backdrop-filter:blur(4px)}
.logo{height:calc(var(--cell)*.13);width:auto;max-width:calc(var(--cell)*.5);object-fit:contain;flex:0 0 auto}
.mark h1{font-family:var(--display);margin:0;line-height:1;font-size:calc(var(--cell)*.088);letter-spacing:-.015em;white-space:nowrap}
.mark .sub{font-family:var(--mono);font-weight:700;color:var(--accent);font-size:calc(var(--cell)*.034);letter-spacing:.2em;text-transform:uppercase}
.legend{margin-left:auto;display:flex;gap:calc(var(--cell)*.022)}
.lg{display:flex;align-items:center;gap:.4em;font-family:var(--mono);font-weight:800;font-size:calc(var(--cell)*.032);
  padding:.3em .55em;border-radius:999px;background:var(--tile);border:1px solid var(--tileBd)}
.lg i{width:.6em;height:.6em;border-radius:2px;background:var(--c);display:block}

/* jackpot strip */
.jp{display:flex;gap:calc(var(--cell)*.02);padding:calc(var(--cell)*.02) calc(var(--cell)*.06);
  background:var(--barBg);border-bottom:1px solid var(--tileBd);flex:0 0 auto;overflow:hidden}
.jpi{display:flex;align-items:baseline;gap:.45em;padding:.25em .7em;border-radius:8px;background:var(--tile);border:1px solid var(--tileBd);white-space:nowrap}
.jpi b{font-family:var(--mono);font-weight:800;font-size:calc(var(--cell)*.03);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.jpi s{text-decoration:none;font-family:var(--display);font-size:calc(var(--cell)*.05);color:var(--accent)}
.jpi em{font-style:normal;font-family:var(--mono);font-size:calc(var(--cell)*.026);color:var(--mute2)}

/* draw-game results ticker — Powerball, Pick 3 &c., fetched live from texaslottery.com,
   crawling along the bottom like a news channel. The track holds the games twice over;
   sliding it half its own width and looping reads as one endless belt. */
.dw{display:block;padding:0;overflow:hidden;background:var(--barBg);
  border-top:1px solid var(--tileBd);flex:0 0 auto;backdrop-filter:blur(4px)}
.dwTrack{display:inline-flex;white-space:nowrap;will-change:transform;
  animation:crawl var(--dwSecs,80s) linear infinite}
@keyframes crawl{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.dwTrack{animation:none}}
.dwHalf{display:inline-flex;align-items:center}
.dwi{display:inline-flex;align-items:center;gap:calc(var(--cell)*.02);
  padding:calc(var(--cell)*.022) calc(var(--cell)*.045);border-right:1px solid var(--tileBd)}
.dwi .glogo{height:calc(var(--cell)*.08);object-fit:contain}
.dwi .gname{font-family:var(--display);font-size:calc(var(--cell)*.04);line-height:1;white-space:nowrap}
.dwi .amt{font-family:var(--display);font-size:calc(var(--cell)*.052);color:var(--accent);line-height:1;white-space:nowrap}
.dwi .amt.alert{color:#FF4D4D}
.dwi .lbl{font-family:var(--mono);font-weight:700;font-size:calc(var(--cell)*.026);letter-spacing:.06em;
  text-transform:uppercase;color:var(--mute);white-space:nowrap}
.dwi .balls{display:inline-flex;gap:calc(var(--cell)*.007)}
.dwi .balls i{font-style:normal;font-family:var(--mono);font-weight:800;
  width:calc(var(--cell)*.06);height:calc(var(--cell)*.06);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell)*.029);
  background:#fff;color:#14161C;border:1px solid rgba(0,0,0,.18)}
.dwi .balls i.sp{background:#E11D2E;color:#fff;border-color:#E11D2E}
.dwi .balls i.fb{background:#F5A623;color:#14161C;border-color:#F5A623}

.stage{flex:1 1 auto;display:flex;min-height:0}
.grid{flex:1 1 auto;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-auto-rows:1fr;
  gap:calc(var(--cell)*.022);padding:calc(var(--cell)*.025);min-height:0}
/* square tiles: sized to explicit px tracks by fitGrid(), centered instead of stretched */
.grid.square{flex:0 0 auto;margin:auto}

/* a ticket tile */
.tk{position:relative;display:flex;flex-direction:column;border-radius:calc(var(--cell)*.02);overflow:hidden;
  background:var(--tile);border:1px solid var(--tileBd);box-shadow:var(--shadow);min-height:0}
.tk.dim{opacity:.22;filter:saturate(.3)}
.tk.pick{outline:calc(var(--cell)*.012) solid var(--c);outline-offset:-2px;background:var(--tile);filter:brightness(1.06)}
.tk.empty{background:transparent;border-style:dashed}

.tkArt{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.tkArt img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:122%;height:122%;object-fit:cover;display:block}
.tkArt .noart{font-family:var(--mono);font-size:calc(var(--cell)*.03);color:var(--mute2);text-align:center;padding:calc(var(--cell)*.03)}
/* price chip, slot no, game no — laid over the art like the real thing */
.chipL{position:absolute;left:calc(var(--cell)*.02);top:calc(var(--cell)*.02);background:var(--chipBg);color:var(--chipInk);
  font-family:var(--mono);font-weight:800;font-size:calc(var(--cell)*.032);padding:.2em .45em;border-radius:4px}
.slotNo{position:absolute;left:50%;top:0;transform:translateX(-50%);background:var(--slotBg);color:var(--slotInk);
  font-family:var(--mono);font-weight:800;font-size:calc(var(--cell)*.044);padding:.12em .5em;border-radius:0 0 6px 6px;min-width:2.1em;text-align:center}
.gameNo{position:absolute;right:calc(var(--cell)*.02);top:calc(var(--cell)*.02);background:var(--chipBg);color:var(--chipInk);
  font-family:var(--mono);font-weight:700;font-size:calc(var(--cell)*.024);padding:.2em .4em;border-radius:4px;line-height:1.15;text-align:right}
.flag{position:absolute;left:calc(var(--cell)*.02);bottom:calc(var(--cell)*.02);display:flex;gap:3px}
.flag span{font-family:var(--mono);font-weight:800;font-size:calc(var(--cell)*.022);padding:.2em .4em;border-radius:3px;color:#14161C}
.f-new{background:#6BBF59}.f-lucky{background:#E8C46A}.f-end{background:#D9534F;color:#fff}

.tkFoot{flex:0 0 auto;background:var(--footBg);color:var(--footInk);border-top:1px solid var(--tileBd);display:flex;align-items:center;justify-content:space-between;
  gap:.4em;padding:calc(var(--cell)*.022) calc(var(--cell)*.03)}
.tkFoot .st{font-family:var(--display);font-size:calc(var(--cell)*.036);letter-spacing:-.01em;line-height:1.1}
.tkFoot .st.low{color:#C0392B}
.tkFoot .cur{text-align:right;line-height:1.05}
.tkFoot .cur b{display:block;font-family:var(--body);font-weight:700;font-size:calc(var(--cell)*.02);color:#7A8497}
.tkFoot .cur s{text-decoration:none;font-family:var(--mono);font-weight:800;font-size:calc(var(--cell)*.036);color:var(--c)}
.tkBar{flex:0 0 auto;height:calc(var(--cell)*.022);background:var(--c)}
.tkName{position:absolute;inset:auto 0 0 0;display:none}

/* spotlight (recommended game / ticket on number) */
.spot{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:4vw;padding:2vw 4vw;min-height:0}
.spot img{max-height:62vh;max-width:34vw;object-fit:contain;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.spot .info{max-width:44vw}
.spot .kick{font-family:var(--mono);font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-size:1.5vw}
.spot h2{font-family:var(--display);font-size:5.2vw;line-height:.98;margin:.18em 0;letter-spacing:-.02em;overflow-wrap:anywhere}
.spot .row{display:flex;gap:1.4vw;align-items:center;margin-top:1.2vw;flex-wrap:wrap}
.spot .big{font-family:var(--display);font-size:4vw;color:var(--c);line-height:1}
.spot .pillx{font-family:var(--mono);font-weight:800;font-size:1.5vw;background:var(--tile);
  border:1px solid var(--tileBd);padding:.35em .7em;border-radius:999px}

/* ad rail + winners ticker */
.rail{flex:0 0 auto;width:calc(var(--cell)*1.05);border-left:1px solid var(--tileBd);
  background:var(--railBg);display:flex;flex-direction:column;padding:calc(var(--cell)*.03);gap:calc(var(--cell)*.03)}
.ad{flex:1 1 auto;display:flex;flex-direction:column;gap:.5em;align-items:center;justify-content:center;text-align:center;
  border:1px solid var(--tileBd);border-radius:calc(var(--cell)*.02);padding:calc(var(--cell)*.03);overflow:hidden;
  background:var(--tile);transition:opacity .5s}
.ad img{max-width:100%;max-height:60%;object-fit:contain;border-radius:6px}
.ad .txt{font-family:var(--display);font-size:calc(var(--cell)*.05);line-height:1.15;overflow-wrap:anywhere}
.ad .kick{font-family:var(--mono);font-size:calc(var(--cell)*.024);letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.win{flex:0 0 auto;border-top:1px solid var(--tileBd);padding-top:calc(var(--cell)*.03)}
.win .kick{font-family:var(--mono);font-size:calc(var(--cell)*.024);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:.5em}
.win .w{display:flex;justify-content:space-between;gap:.5em;font-size:calc(var(--cell)*.028);padding:.3em 0;border-bottom:1px dashed var(--tileBd)}
.win .w b{font-family:var(--mono);color:#6BBF59}

/* ---- ticket card (Texas Lottery style: art carries the price + game no) ---- */
.tc{position:relative;display:flex;flex-direction:column;min-height:0;border-radius:calc(var(--cell)*.035);
  background:var(--cardBg,#fff);box-shadow:var(--cardSh,0 3px 10px rgba(20,23,31,.13));overflow:hidden;
  border:1px solid var(--tileBd)}
.tc.dim{opacity:.2;filter:saturate(.25)}
.tc.pick{outline:calc(var(--cell)*.012) solid var(--accent);outline-offset:-1px}
.tc.empty{background:transparent;border:1px dashed var(--tileBd);box-shadow:none}
.tcArt{flex:1 1 auto;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;
  overflow:hidden}
/* show the whole ticket photo, uncropped — object-fit:contain never cuts off any art.
   Whatever leftover space that leaves around the image gets filled with a color sampled
   from the photo itself (see fitArt), so it blends in instead of showing blank bars.
   Anchor is configurable under Branding > Ticket properties for where that leftover space sits. */
.tcArt img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:100%;height:100%;object-fit:contain;display:block}
.tcArt.pic-top img{bottom:auto;top:0}
.tcArt.pic-middle img{bottom:auto;top:50%;transform:translate(-50%,-50%)}
.tcArt .noart{font-family:var(--mono);font-size:calc(var(--cell)*.03);color:#9CA3AF;text-align:center;line-height:1.4;padding:calc(var(--cell)*.03)}
.tcArt .pxy{font-family:var(--display);color:#111827;text-align:center;line-height:1.05;padding:calc(var(--cell)*.03)}
.tcArt .pxy b{display:block;font-size:calc(var(--cell)*.075)}
.tcArt .pxy s{text-decoration:none;display:block;font-family:var(--mono);font-size:calc(var(--cell)*.03);color:#6B7280}
/* the slot number — what the customer says out loud. A plain white disc bottom-center
   reads clearly against any ticket art, bright or dark, same trick the state's own
   printed tickets use for the game number. Position is configurable (left/middle/right)
   under Branding > Ticket properties; "middle" (the default) is this centered rule. */
.slotB{position:absolute;left:50%;bottom:calc(var(--cell)*.025);transform:translateX(-50%);
  background:#fff;color:#14161C;font-family:var(--mono);font-weight:800;
  font-size:calc(var(--cell)*.095);line-height:1;width:calc(var(--cell)*.2);height:calc(var(--cell)*.2);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.4);z-index:2}
.slotB.left{left:calc(var(--cell)*.03);transform:none}
.slotB.right{left:auto;right:calc(var(--cell)*.03);transform:none}
/* the ticket price — a folded-corner ribbon banner, tucked into just the corner so the
   band itself doesn't slice across the middle of the ticket art. Text stays big (solid
   black on white) even though the ribbon's footprint is small — that's the whole point */
.priceB{position:absolute;left:0;top:0;width:40%;height:40%;overflow:hidden;z-index:2;pointer-events:none}
.priceB i{position:absolute;left:-30%;top:15%;width:150%;transform:rotate(-45deg);transform-origin:center;
  background:#fff;color:#14161C;text-align:center;font-family:var(--mono);font-weight:800;
  font-style:normal;font-size:calc(var(--cell)*.075);letter-spacing:.01em;padding:calc(var(--cell)*.02) 0;
  box-shadow:0 1px 6px rgba(0,0,0,.35)}
/* the state's own CLOSING SOON corner ribbon */
.ribbon{position:absolute;right:0;bottom:0;width:60%;height:60%;overflow:hidden;z-index:2;pointer-events:none}
.ribbon i{position:absolute;right:-32%;bottom:18%;width:150%;transform:rotate(-45deg);transform-origin:center;
  background:#E11D2E;color:#fff;text-align:center;font-family:var(--body);font-weight:800;
  font-size:calc(var(--cell)*.026);letter-spacing:.04em;padding:calc(var(--cell)*.012) 0;
  box-shadow:0 1px 5px rgba(0,0,0,.3);font-style:normal}
/* owner-set OUT OF STOCK / COMING SOON — a full-tile picture that replaces the ticket art */
.stockArt{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:calc(var(--cell)*.028);text-align:center;color:#fff;overflow:hidden;pointer-events:none}
/* black poster; the label carries the colour so it still reads OOS vs Coming Soon */
.stockArt{background:radial-gradient(120% 100% at 50% 32%,#1b1c20 0%,#0a0a0c 70%,#000 100%)}
.stockArt.oos .lbl,.stockArt.oos .ico{color:#FF5A4E}
.stockArt.oos .ico{stroke:#FF5A4E}
.stockArt.soon .lbl,.stockArt.soon .ico{color:#5AB4FF}
.stockArt.soon .ico{stroke:#5AB4FF}
/* faint diagonal caution stripes behind the label */
.stockArt::before{content:"";position:absolute;inset:0;opacity:.10;
  background:repeating-linear-gradient(45deg,#fff 0 calc(var(--cell)*.055),transparent 0 calc(var(--cell)*.11))}
.stockArt .ico{width:calc(var(--cell)*.30);height:calc(var(--cell)*.30);position:relative;
  filter:drop-shadow(0 calc(var(--cell)*.006) calc(var(--cell)*.012) rgba(0,0,0,.4))}
.stockArt .lbl{position:relative;font-family:var(--display);font-weight:800;text-transform:uppercase;
  letter-spacing:.01em;line-height:.94;font-size:calc(var(--cell)*.128);
  text-shadow:0 calc(var(--cell)*.006) calc(var(--cell)*.014) rgba(0,0,0,.35)}
.stockArt .sub{position:relative;max-width:86%;font-family:var(--mono);font-weight:700;opacity:.92;
  letter-spacing:.06em;font-size:calc(var(--cell)*.03);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcFoot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:.4em;
  padding:calc(var(--cell)*.018) calc(var(--cell)*.028);background:var(--footBg);color:var(--footInk);
  border-top:1px solid var(--tileBd)}
.tcFoot .st{font-family:var(--display);font-size:calc(var(--cell)*.034);line-height:1.1;letter-spacing:-.01em}
.tcFoot .st.low{color:#C0392B}
.tcFoot .cur{text-align:right;line-height:1.05}
.tcFoot .cur b{display:block;font-family:var(--body);font-weight:700;font-size:calc(var(--cell)*.019);color:#8A93A3}
.tcFoot .cur s{text-decoration:none;font-family:var(--mono);font-weight:800;font-size:calc(var(--cell)*.034);color:var(--c)}
.tcBar{flex:0 0 auto;height:calc(var(--cell)*.018);background:var(--c)}
.grid.anim .tc{animation:rise .3s cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--i)*12ms)}
@media (prefers-reduced-motion:reduce){.grid.anim .tc{animation:none}}

@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.grid.anim .tk{animation:rise .3s cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--i)*12ms)}
@media (prefers-reduced-motion:reduce){.grid.anim .tk{animation:none}}

.chrome{position:fixed;right:14px;bottom:14px;display:flex;gap:8px;z-index:30;transition:opacity .4s}
.chrome.idle{opacity:0;pointer-events:none}
.cbtn{background:rgba(20,22,30,.9);color:#F2F1EC;border:1px solid rgba(255,255,255,.25);border-radius:8px;
  padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer}

/* ============ COUNTER-SIDE APP — red & white ============ */
#counter{height:100vh;overflow:auto;background:#F7F8FA;color:#14171F}
.cwrap{max-width:560px;margin:0 auto;padding:18px 16px 60px}
.chead{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.chead h2{font-size:19px;margin:0;font-weight:800;color:var(--r)}
.chead .st{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:800;color:#fff;
  background:var(--r);padding:5px 9px;border-radius:999px}
.csec{background:#fff;border:1px solid #E2E5EA;border-radius:14px;padding:14px;margin-bottom:14px;
  box-shadow:0 1px 2px rgba(20,23,31,.05)}
.csec h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:#8A93A1;
  display:flex;align-items:center;gap:7px}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.cgrid.two{grid-template-columns:repeat(2,1fr)}
.cb{background:#fff;border:1.5px solid #CFD4DC;border-radius:11px;padding:15px 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:13px;
  color:#14171F;transition:.12s}
.cb:hover{border-color:var(--r);color:var(--r);background:var(--r-lt)}
.cb.on{background:var(--r);border-color:var(--r);color:#fff}
.cb .ic{font-size:20px;line-height:1}
.cb .pz{font-family:var(--mono);font-weight:800;font-size:17px}
.cnum{display:flex;gap:8px}
.cnum input{flex:1;padding:12px;border:1.5px solid #CFD4DC;border-radius:11px;font-family:var(--mono);
  font-weight:800;font-size:16px;text-align:center;background:#fff;color:#14171F}
.cnum input:focus{border-color:var(--r);outline:none;box-shadow:0 0 0 3px var(--r-lt)}
.cbtn2{background:var(--r);color:#fff;border:none;border-radius:11px;padding:12px 18px;font-weight:700;cursor:pointer}
.cbtn2:hover{background:var(--r-dk)}
.cbtn2.ghost{background:#fff;color:var(--r);border:1.5px solid #CFD4DC}
.cbtn2.ghost:hover{border-color:var(--r);background:var(--r-lt)}

/* counter: section tabs + the mobile Lotto shift-entry screen */
.ctabs{display:flex;gap:6px;margin-bottom:14px}
.ctab{flex:1;padding:9px;font-size:12.5px;font-weight:700;border-radius:11px;border:1.5px solid #CFD4DC;
  background:#fff;color:#5B6472;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.ctab .ic{font-size:17px;line-height:1}
.ctab.on{background:var(--r-lt);border-color:var(--r);color:var(--r)}
.cshifts{display:flex;gap:6px;margin-bottom:14px}
.cshift{flex:1;padding:9px;font-size:13px;font-weight:700;border-radius:11px;border:1.5px solid #CFD4DC;

/* ============ BACKEND — red & white ============ */
:root{
  --r:#D62828;        /* the red */
  --r-dk:#A81E1E;     /* pressed / hover */
  --r-lt:#FDECEC;     /* red tint for fills */
  --ink:#14171F;      /* text */
  --ink-2:#5B6472;    /* secondary text */
  --ink-3:#8A93A1;    /* labels */
  --bd:#E2E5EA;       /* hairline */
  --bd-2:#CFD4DC;     /* input border */
  --sf:#FFFFFF;       /* panels */
  --sf-2:#F7F8FA;     /* page + table head */
}
#admin{height:100vh;background:var(--sf-2);color:var(--ink);display:flex}
.sp{flex:1}
/* left sidebar — brand, then the store switcher as a labeled field (not just a bare
   select), a clearly separated nav list as the main act, and a quiet account footer.
   Each zone gets its own visual weight instead of one long column of same-size buttons. */
.aside{width:220px;flex:0 0 auto;height:100vh;overflow-y:auto;background:#fff;
  border-right:1px solid var(--bd);display:flex;flex-direction:column}
.aBrand{padding:20px 18px 16px;border-bottom:1px solid var(--bd)}
.aBrand h2{font-family:var(--display);font-size:18px;margin:0;color:var(--r);line-height:1.2}
.aStoreIcon{width:38px;height:38px;border-radius:10px;background:var(--r-lt);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:19px}
.aStoreField{padding:14px 18px;border-bottom:1px solid var(--bd)}
.aStoreField label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink-3);font-weight:700;margin-bottom:6px}
.aStoreField select{width:100%}
.vtabs{display:flex;flex-direction:column;gap:1px;flex:1 1 auto;padding:10px 10px;overflow-y:auto}
.vtab{background:transparent;color:var(--ink-2);border:none;border-radius:8px;padding:9px 12px;
  font-size:13px;font-weight:600;cursor:pointer;text-align:left;width:100%;
  display:flex;align-items:center;gap:10px}
.vtab svg{flex:0 0 auto;opacity:.85}
.vtab:hover{color:var(--r);background:var(--r-lt)}
.vtab.on{background:var(--r-lt);color:var(--r);font-weight:800}
/* small inline period-selector pills — chart range, top-sellers range, etc. */
.ptabs{display:flex;gap:4px;flex-wrap:wrap}
.ptab{background:transparent;color:var(--ink-2);border:1px solid var(--bd-2);border-radius:999px;
  padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer}
.ptab:hover{border-color:var(--r);color:var(--r)}
.ptab.on{background:var(--r);border-color:var(--r);color:#fff}
/* quiet footer: connection dot, one prominent action, small utility links, account —
   nothing here competes visually with the nav list above it */
.aFoot{border-top:1px solid var(--bd);padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.aFoot #link{font-size:11px;text-align:left;padding:0}
.aFoot .btn.go{width:100%;justify-content:center}
.aUtil{display:flex;gap:6px}
.aUtil .btn{flex:1;padding:7px 8px;font-size:12px}
.aAcct{display:flex;align-items:center;gap:8px;padding-top:8px;border-top:1px solid var(--bd)}
.aAvatar{width:26px;height:26px;border-radius:50%;background:var(--r-lt);color:var(--r);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.aAcct .who{flex:1;min-width:0;font-size:12px;line-height:1.25}

.amain{flex:1 1 auto;height:100vh;overflow-y:auto}

<body>

    <p class="sub" id="lSub"></p>

    <div class="f"><label>PIN</label><input id="lPin" inputmode="numeric" maxlength="6" placeholder="4-6 digits"></div>
    <div class="lerr" id="lErr"></div>
    <button class="cbtn2" id="lGo" style="width:100%">Sign in</button>
    <p class="sub" id="lForgot" style="margin:14px 0 0;text-align:center"></p>
  </div>

<div id="toast"></div>

<script>
/* ---------------- storage ----------------
   Two modes:
   · SERVED  — running under server.py. The board lives on the server, so the TV, the
               counter phone and the backend all see the same thing. Changes made
               anywhere show up everywhere within ~1.5s.
   · SOLO    — opened as a plain file. Falls back to this browser's own storage
               (fine for one machine; other devices won't see it).                     */
const KEY='lotterydisplay.v1';
/* ---------------- accounts: PIN-only login, per-store permissions ----------------
   Roles:  owner   — everything, every store, manages stores & accounts
           manager — edit games/ads/jackpots/branding/sales for their assigned store(s)
           clerk   — counter app only, for their assigned store(s); no backend access
   `stores` on an account is either the string 'all' (owner) or an array of store ids.
   Each account's PIN must be unique across the board — it's the only thing that
   identifies who's signing in, so two accounts can't share one. */
const currentAccount=()=>{
  const id=localStorage.getItem('ld.session');
  return id?(db.accounts||[]).find(a=>a.id===id)||null:null;
};
const accountStoreIds=a=>!a?[]:a.stores==='all'?db.stores.map(s=>s.id):(a.stores||[]);
/* if the signed-in account can't use the currently active store, hop to one it can */
function ensureActiveAllowed(acc){
  const allowed=accountStoreIds(acc);
  if(allowed.length&&!allowed.includes(db.active)){db.active=allowed[0];local.set(db)}
}
function signOut(){localStorage.removeItem('ld.session');route()}
let mem=null, SERVED=false, rev=0, pushT=null, pulling=false, dirty=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const local={
  get(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return mem}},
  set(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){mem=v;
    if(/quota|exceed/i.test(String(e)))toast('Storage full — use smaller pictures, or link them instead')}}
};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1900)};

/* the PIN of whoever's signed in, sent with every write so the server can check who's
   allowed to do what (see server.py's find_account/account_can_admin) */
const authHeaders=()=>{const a=currentAccount();return a?{'X-Pin':String(a.pin||'')}:{}};

function renderLogin(){
  const setup=!(db.accounts||[]).length;
  $('#lTitle').textContent=setup?'Create the owner login':'Sign in';
  $('#lSub').textContent=setup
    ?'First time here — set up the master login for this board. You\'ll use this PIN on every device from now on.'
    :'Enter your PIN.';
  $('#lNameWrap').style.display=setup?'':'none';
  // never clobber what's mid-typing — a poll landing between keystrokes would otherwise
  // wipe the field out from under whoever's signing in
  const typingHere=document.activeElement&&['lPin','lName'].includes(document.activeElement.id);
  if(!typingHere){$('#lPin').value='';$('#lName').value='';$('#lErr').textContent=''}
  $('#lGo').textContent=setup?'Create & sign in':'Sign in';
  $('#lForgot').textContent=setup?''
    :'Forgot your PIN? Ask your Owner to reset it under Stores & accounts — or if you\'re the Owner, run reset_pin.py on the machine hosting this board.';
}
$('#lGo').onclick=()=>{
  const setup=!(db.accounts||[]).length;
  const pin=$('#lPin').value.trim();
  if(!/^\d{4,6}$/.test(pin)){$('#lErr').textContent='PIN must be 4-6 digits';return}
  if(setup){
    const acc={id:'a'+Math.random().toString(36).slice(2,8),name:$('#lName').value.trim()||'Owner',
      pin,role:'owner',stores:'all'};

  }
  const acc=(db.accounts||[]).find(a=>String(a.pin)===pin);
  if(!acc){$('#lErr').textContent='PIN not recognized';return}

/* push to the server, debounced — a burst of edits becomes one write */
function push(){
  if(!SERVED)return;
  clearTimeout(pushT);
  pushT=setTimeout(async()=>{
    try{
      const r=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json',...authHeaders()},
        body:JSON.stringify({state:db})});
      const j=await r.json().catch(()=>({}));
      // fetch doesn't throw on 401/403/500 — only treat an actual accept as success,
      // otherwise keep `dirty` so the edit is retried and the link shows offline
      if(r.ok&&j.rev){rev=j.rev;dirty=false;setLink(true);}
      else{setLink(false);}
    }catch(e){setLink(false)}
  },220);
}
/* has anyone else changed the board? */
async function pull(){
  if(!SERVED||pulling)return;
  try{
    const r=await fetch('/api/rev',{cache:'no-store'});
    const j=await r.json();
    if(j.rev===rev){setLink(true);return}
    // don't yank a field out from under someone who's typing in the backend —
    // or on the login screen itself, which can be showing on #admin or #counter
    const typing=document.activeElement&&/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
    const onLogin=!$('#login').classList.contains('hidden');
    if(typing&&(location.hash==='#admin'||onLogin))return;
    pulling=true;
    const r2=await fetch('/api/state',{cache:'no-store'});
    const j2=await r2.json();
    syncFromServer(j2.state,j2.rev);
    setLink(true);
  }catch(e){setLink(false)}
  finally{pulling=false}
}
function setLink(ok){
  const txt=SERVED?(ok?'● live':'● offline'):'● this device only';
  const col=SERVED?(ok?'#6BBF59':'#E05C5C'):'#8E97AA';
  $$('#link,[id="link"]').forEach(el=>{el.textContent=txt;el.style.color=col;});
}
const save=()=>{local.set(db);dirty=true;push();};

/* Ticket art. A Texas Lottery picture is served from our own machine (/art/2747.gif) —
   the state's site can refuse hotlinked images, and this way the TV needs no internet.
   Anything you uploaded yourself is left exactly as it is. */
const TXART=/texaslottery\.com.*?scratchoffs\/(\d{3,5})_/i;
function imgSrc(u){
  u=String(u||'');
  if(!u)return '';
  if(u.startsWith('data:'))return u;            // you uploaded it — already local
  if(!SERVED)return u;                          // no server, nothing we can do
  const m=u.match(TXART);
  if(m)return `/art/${m[1]}.gif`;               // Texas Lottery ticket art
  if(/^https?:\/\//i.test(u))return `/api/img?u=${encodeURIComponent(u)}`;  // any other link
  return u;
}
/* if the local copy misses, fall back to the state's URL; if that fails too, show the price */
function imgTag(g,cls=''){
  const src=imgSrc(g.img);
  const back=esc(g.img||'');
  return `<img ${cls?`class="${cls}" `:''}src="${esc(src)}" alt="" loading="lazy" onload="fitArt(this)"
    onerror="if(!this.dataset.t){this.dataset.t=1;this.src='${back}';}else{this.style.display='none';if(this.nextElementSibling)this.nextElementSibling.style.display='';}">`;
}
/* the photo is shown whole (object-fit:contain), so it rarely fills the tile edge-to-edge —
   sample its own dominant color and use that to fill the leftover space, instead of leaving
   blank bars. Runs once per image load. Cross-origin art (no local/proxy copy) can't be read
   by canvas, so this silently no-ops and the tile keeps its plain background. */
function fitArt(img){
  const box=img.parentElement;
  if(!box)return;
  try{
    const cv=document.createElement('canvas'),cw=16,ch=16;
    cv.width=cw;cv.height=ch;
    const ctx=cv.getContext('2d');
    ctx.drawImage(img,0,0,cw,ch);
    const data=ctx.getImageData(0,0,cw,ch).data;
    let r=0,g=0,b=0,n=0;
    for(let i=0;i<data.length;i+=4){
      const rr=data[i],gg=data[i+1],bb=data[i+2],lum=(rr+gg+bb)/3;
      if(lum>245||lum<12)continue;              // skip near-white/near-black borders & text
      r+=rr;g+=gg;b+=bb;n++;
    }
    if(!n){r=data[0];g=data[1];b=data[2];n=1;}
    box.style.background=`rgb(${Math.round(r/n)},${Math.round(g/n)},${Math.round(b/n)})`;
  }catch(e){/* tainted canvas — leave the tile's default background */}
}

const normalizeDb=d=>{
  if(!d)return d;
  if(!Array.isArray(d.accounts))d.accounts=[];
  d.accounts.forEach(a=>{delete a.phone});  // login is PIN-only now
  (d.stores||[]).forEach(s=>{
    (s.games||[]).forEach(g=>{if(typeof g.status!=='string')g.status=''});  // stock override added later
    if(!s.lotto||typeof s.lotto!=='object')s.lotto={};
    if(!Array.isArray(s.intake))s.intake=[];  // ticket-lifecycle log: confirmed -> activated
    if(s.brand&&!s.brand.appAccent)s.brand.appAccent='#D62828';  // Backend/Counter color, separate from the TV's theme
    if(s.view){s.view.showJp=false;s.view.showWinners=false}  // Jackpots/Winners tabs retired — keep the TV strips off too
    if(!(+((s.view||{}).lottoShifts)))((s.view=s.view||{}).lottoShifts=1);
    if(!Array.isArray((s.view||{}).lottoShiftNames))s.view.lottoShiftNames=['Shift 1','Shift 2'];
    // Boxes mirror the 40 game slots 1-to-1 (box i IS slot i, priced from the Games tab).
    // A day is now {shifts:[…]}. Migrate older shapes: a flat single-day entry becomes one
    // shift; 38-box / bare-qty arrays get carried across by index and padded to 40.
    // each box snapshots its game+price (so a swapped-in book keeps its own price) plus
    // the quantity left; a shift also holds staged newBooks for the next shift/day
    const gn=i=>String((s.games[i]||{}).name||''),gp=i=>String((s.games[i]||{}).price||'');
    const fixBoxes=(ob,oq)=>Array.from({length:40},(_,i)=>{const b=(ob&&ob[i])||{};
      return {game:(b.game!==undefined&&b.game!=='')?String(b.game):gn(i),price:(b.price!==undefined&&b.price!=='')?String(b.price):gp(i),
        qty:b.qty!==undefined?String(b.qty??''):(oq?String(oq[i]||''):'')}});
    Object.values(s.lotto).forEach(e=>{
      if(!Array.isArray(e.shifts)){
        const sh={clerk:'',open:e.open??'',openAuto:e.openAuto,add:e.add??'',online:e.online??'',close:e.close??'',closeAuto:e.closeAuto,
          boxes:fixBoxes(Array.isArray(e.boxes)?e.boxes:null,Array.isArray(e.qty)?e.qty:null),newBooks:[]};
        e.shifts=[sh];
        ['open','openAuto','add','online','close','closeAuto','boxes','qty'].forEach(k=>delete e[k]);
      }
      e.shifts.forEach(sh=>{
        if(typeof sh.clerk!=='string')sh.clerk='';
        if(!Array.isArray(sh.newBooks))sh.newBooks=[];
        sh.boxes=fixBoxes(Array.isArray(sh.boxes)?sh.boxes:null,null);
      });
    });
  });
  return d;
};

const filled=g=>!!(g.name||g.img||g.no);
/* a game is "ending" if the state called it, or its top prizes are down to the threshold */
const isEnding=(g,at)=>!!g.closing||(g.prizesLeft!==''&&g.prizesLeft!=null&&+g.prizesLeft<=+at);
function statusOf(g,at){
  const pl=(g.prizesLeft!==''&&g.prizesLeft!=null)?+g.prizesLeft:null;
  if(pl===0)return{txt:'LAST CHANCE',low:true};
  if(pl!=null&&pl<=+at)return{txt:`ONLY ${pl} LEFT`,low:true};
  if(g.closing)return{txt:'CLOSING SOON',low:true};
  return{txt:'GOOD LUCK',low:false};
}
/* recommended = best top-prizes-left per dollar, among filled games with data */
function recommended(games){
  const c=games.filter(g=>filled(g)&&+g.price>0&&+g.prizesLeft>0);
  if(!c.length)return null;
  return c.slice().sort((a,b)=>(+b.prizesLeft/+b.price)-(+a.prizesLeft/+a.price))[0];
}
function recSlots(games,at){ // healthy stock + prizes still out there
  return games.filter(g=>filled(g)&&+g.prizesLeft>+at).slice(0,10).map(g=>g.slot);
}
/* how many of the 40 slots the store actually uses — the rest stay in storage
   (so lowering the count never deletes a game) but are hidden everywhere */
const slotCount=st=>Math.min(40,Math.max(1,+((st||S()).view||{}).slots||40));
function shownGames(st){
  const n=slotCount(st);
  let g=st.games.filter(x=>+x.slot<=n).filter(x=>st.view.empty==='hide'?filled(x):true);
  if(st.view.sort==='num')g=[...g].sort((a,b)=>(+a.no||9e9)-(+b.no||9e9));
  if(st.view.sort==='price')g=[...g].sort((a,b)=>(+a.price||9e9)-(+b.price||9e9)||(+a.slot)-(+b.slot));
  return g;
}

function shrink(file,MAX=380){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('Could not read that file'));
    fr.onload=()=>{const im=new Image();
      im.onerror=()=>rej(new Error('That file is not an image'));
      im.onload=()=>{const s=Math.min(1,MAX/Math.max(im.width,im.height));
        const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.78));};
      im.src=fr.result;};
    fr.readAsDataURL(file);});
}
/* one prompt for every "Link" button. An uploaded picture has no URL to show, so the box
   starts empty; leaving it empty clears the picture. Returns null if you hit Cancel. */

}

let DRAWS=null;

  if(!SERVED)return;
  try{

    if(j.ok&&j.games&&j.games.length){

function renderDraws(st){

/* mix a hex color toward black (negative percent) or white (positive), same trick
   browsers' own devtools color pickers use for a quick shade/tint */
function shadeHex(hex,percent){
  const f=parseInt((hex||'#D62828').slice(1),16),t=percent<0?0:255,p=Math.abs(percent);
  const R=f>>16,G=f>>8&0xFF,B=f&0xFF;
  return '#'+(0x1000000+(Math.round((t-R)*p)+R)*0x10000+(Math.round((t-G)*p)+G)*0x100+(Math.round((t-B)*p)+B)).toString(16).slice(1);
}

  r.setProperty('--r',c);

}

/* size the grid to fill the stage edge to edge. 'auto' columns picks whatever column
   count gives the biggest, squarest tiles for this screen; a number forces that many
   across. Tracks stretch to use every pixel, so there's no dead margin left or right. */
function bestCols(total,availW,availH){
  let best=4,bestCell=0;
  for(let c=4;c<=Math.min(14,total);c++){
    const r=Math.ceil(total/c);
    const cell=Math.min(availW/c,availH/r);
    if(cell>bestCell){bestCell=cell;best=c}
  }
  return best;
}
function fitGrid(cols,total){
  const stage=$('.stage'),grid=$('#bGrid'),rail=$('#bRail');
  if(!stage||!grid)return;
  const railW=(rail&&!rail.classList.contains('hidden'))?rail.getBoundingClientRect().width:0;
  const availW=stage.clientWidth-railW,availH=stage.clientHeight;
  if(availW<=0||availH<=0)return;
  if(cols==='auto')cols=bestCols(total||40,availW,availH);
  const rows=Math.max(1,Math.ceil((total||40)/cols));
  const GAP=.022,PAD=.05; // matches the .grid gap/padding formulas below, both in units of --cell
  // typography scales off the smaller side of a tile, so badges never outgrow the art
  const cell=Math.max(20,Math.floor(Math.min(
    availW/(cols+(cols-1)*GAP+PAD),
    availH/(rows+(rows-1)*GAP+PAD)
  )));
  const chrome=(n,avail)=>Math.max(20,Math.floor((avail-((n-1)*GAP+PAD)*cell)/n));
  const cw=chrome(cols,availW),ch=chrome(rows,availH);
  grid.style.setProperty('--cell',cell+'px');
  grid.style.gridTemplateColumns=`repeat(${cols},${cw}px)`;
  grid.style.gridTemplateRows=`repeat(${rows},${ch}px)`;
}
window.addEventListener('resize',()=>{if(lastGridFit)fitGrid(...lastGridFit)});
let lastGridFit=null;
function renderBoard(){
  const st=S(),cmd=db.cmd||{mode:'all'};
  applyTheme(st);renderBg(st);
  $('#bTitle').textContent=st.brand.title||st.name;
  $('#bSub').textContent=st.brand.sub||'';
  const lg=$('#bLogo');
  if(st.brand.logo){lg.src=imgSrc(st.brand.logo);lg.classList.remove('hidden')}else lg.classList.add('hidden');

  const used=[...new Set(st.games.filter(filled).map(g=>+g.price).filter(Boolean))].sort((a,b)=>a-b);
  $('#bLegend').innerHTML=used.map(p=>`<span class="lg" style="--c:${tierColor(p)}"><i></i>$${p}</span>`).join('');

  // jackpots
  const jp=$('#bJp');
  if(st.view.showJp&&st.jackpots.length){jp.classList.remove('hidden');
    jp.innerHTML=st.jackpots.map(j=>`<div class="jpi"><b>${esc(j.game)}</b><s>${esc(j.amount)}</s>${j.draw?`<em>${esc(j.draw)}</em>`:''}</div>`).join('');
  }else jp.classList.add('hidden');

  // live draw results — set visibility before fitGrid measures the stage
  renderDraws(st);

  // stage: spotlight or grid
  const grid=$('#bGrid');
  const stale=cmd.at&&db.cmd.holdSecs&&(Date.now()-cmd.at)/1000>db.cmd.holdSecs;
  const mode=stale?'all':(cmd.mode||'all');

  if(mode==='recommended'){
    const g=recommended(st.games);
    grid.className='grid';grid.style.display='block';
    grid.style.gridTemplateColumns='';grid.style.gridTemplateRows='';lastGridFit=null;
    grid.innerHTML=g?spotlight(g,st,'Recommended game'):'<div class="spot"><div class="info"><h2>Add prize data to get a recommendation</h2></div></div>';
  }else if(mode==='number'){
    const g=st.games.find(x=>String(x.slot)===String(cmd.value)||String(x.no)===String(cmd.value));
    grid.className='grid';grid.style.display='block';
    grid.style.gridTemplateColumns='';grid.style.gridTemplateRows='';lastGridFit=null;
    grid.innerHTML=g&&filled(g)?spotlight(g,st,'Ticket '+cmd.value):`<div class="spot"><div class="info"><h2>No ticket at ${esc(cmd.value)}</h2></div></div>`;
  }else{
    grid.className='grid anim square';grid.style.display='';
    const list=shownGames(st);
    const slots=mode==='slots'?recSlots(st.games,st.view.endingAt):null;
    grid.innerHTML=list.map((g,i)=>{
      let dim=false,pick=false;
      if(mode==='price')dim=+g.price!==+cmd.value;
      if(mode==='new')dim=!g.isNew;
      if(mode==='lucky')dim=!g.isLucky;
      if(mode==='ending')dim=!isEnding(g,st.view.endingAt);
      if(mode==='slots'){pick=slots.includes(g.slot);dim=!pick}
      if(!filled(g))dim=dim||mode!=='all';
      return ticketTile(g,i,st,{dim,pick});
    }).join('');
    lastGridFit=[st.view.cols==='auto'?'auto':(+st.view.cols||5),list.length];
    fitGrid(...lastGridFit);
  }

  // rail: ads + winners
  const rail=$('#bRail');
  const wantAds=st.view.showAds&&st.ads.length, wantWin=st.view.showWinners&&st.winners.length;
  if(wantAds||wantWin){
    rail.classList.remove('hidden');
    rail.innerHTML=(wantAds?`<div class="ad" id="adSlot"></div>`:'')+
      (wantWin?`<div class="win"><div class="kick">Recent winners here</div>${
        st.winners.slice(0,6).map(w=>`<div class="w"><span>${esc(w.name)} · ${esc(w.game)}</span><b>${esc(w.amount)}</b></div>`).join('')
      }</div>`:'');
    clearInterval(adTimer);
    if(wantAds){
      const paint=()=>{const a=st.ads[adIdx%st.ads.length],el=$('#adSlot');if(!el)return;
        el.style.opacity=0;
        setTimeout(()=>{el.innerHTML=`<div class="kick">${esc(a.kick||'In store now')}</div>
          ${a.img?`<img src="${esc(imgSrc(a.img))}" alt="">`:''}${a.text?`<div class="txt">${esc(a.text)}</div>`:''}`;
          el.style.opacity=1;},220);};
      paint();
      adTimer=setInterval(()=>{adIdx++;paint()},Math.max(3,+st.view.adSecs||8)*1000);
    }
  }else{rail.classList.add('hidden');clearInterval(adTimer)}
}

/* today's lotto entry, auto-created the same way the Backend's "Log a day" does —
   the counter shouldn't make a clerk go find that button */
function ensureTodayLotto(st){
  st.lotto=st.lotto||{};
  const d2=new Date().toISOString().slice(0,10);
  if(st.lotto[d2])return;
  const prevDate=Object.keys(st.lotto).sort().reverse()[0];
  const prevLast=prevDate?dayLast(st.lotto[prevDate]):null;
  const shifts=[];for(let k=0;k<lottoShiftCount(st);k++)shifts.push(makeShift());
  if(prevLast){
    shifts[0].boxes=prevLast.boxes.map(b=>({game:String(b.game??''),price:String(b.price??''),qty:String(b.qty??'')}));
    promoteNewBooks(st,prevLast,shifts[0]);
  }
  st.lotto[d2]={shifts};syncLottoChain(st);save();
}
/* mobile shift-entry screen: shift picker, meter card, then the box list with a
   jump-to-box search — same data-lt/data-ltqty attributes as the Backend's shiftEditor,
   so the existing input/change/click handlers drive both without duplicating logic */
function counterLottoView(st){
  const d=new Date().toISOString().slice(0,10),day=st.lotto[d];
  if(!day)return '<div class="csec">Nothing to log yet today.</div>';
  const shifts=dayShifts(day),cfg=lottoShiftCount(st);
  if(cShiftIdx>=shifts.length)cShiftIdx=shifts.length-1;
  const si=cShiftIdx,sh=shifts[si];
  const prevDate=Object.keys(st.lotto).filter(x=>x<d).sort().reverse()[0];
  const prevDayLast=prevDate?dayLast(st.lotto[prevDate]):null;
  const prevBoxes=si>0?shifts[si-1].boxes:(prevDayLast?prevDayLast.boxes:null);
  const sold=lottoSold(sh),boxTotal=lottoBoxTotal(sh),os=lottoOverShort(sh);
  const osBg=os===0?'#E7F5EC':Math.abs(os)<20?'#FDF3E3':'#FDECEC';
  const osFg=os===0?'#157F3B':Math.abs(os)<20?'#8A5A00':'#D9534F';
  const hasPrev=si>0||Object.keys(st.lotto).some(x=>x<d),openAuto=sh.openAuto!==false;
  const n=slotCount(st);
  const q=cBoxFilter.trim().toLowerCase();
  const rows=sh.boxes.slice(0,n).map((b,i)=>({b,i})).filter(({b,i})=>{
    if(!q)return true;
    return String(i+1).includes(q)||(b.game||'').toLowerCase().includes(q);
  });
  const enteredCount=sh.boxes.slice(0,n).filter(b=>b.qty!=='').length;

  return `
    ${cfg>1?`<div class="cshifts">${shifts.map((s,i)=>`<button class="cshift ${i===si?'on':''}" data-cshift="${i}">${esc(lottoShiftName(st,i))}</button>`).join('')}
      ${shifts.length<2?`<button class="cshift" data-ltaddshift="${d}">+ Add</button>`:''}</div>`:''}

    <div class="csec">
      <h3>Clerk</h3>
      <input class="in" data-ltclerk="${si}" data-date="${d}" value="${esc(sh.clerk||'')}" placeholder="Who's working this shift"
        style="width:100%;height:36px;padding:0 10px;border:1.5px solid #CFD4DC;border-radius:9px;font-size:13px">
    </div>

    <div class="csec">
      <h3>Meter</h3>
      <div class="cmeter">
        <div class="mf"><label>Open ${hasPrev?(openAuto?'<span style="color:#157F3B">auto</span>':''):''}</label>
          <div class="v">$${(+sh.open||0).toFixed(2)}</div></div>
        <div class="mf"><label>Close (from boxes)</label><div class="v" style="color:#D62828">$${boxTotal.toFixed(2)}</div></div>
        <div class="mf"><label>Add</label><input inputmode="decimal" data-lt="add" data-shift="${si}" data-date="${d}" value="${esc(sh.add)}" placeholder="0"></div>
        <div class="mf"><label>Online</label><input inputmode="decimal" data-lt="online" data-shift="${si}" data-date="${d}" value="${esc(sh.online)}" placeholder="0"></div>
      </div>
    </div>

    <div class="cos" style="background:${osBg};color:${osFg}">
      <span>${os===0?'Box total matches close':Math.abs(os)<20?'Small mismatch':'Over / short'}</span>
      <span>${os>=0?'+':''}$${os.toFixed(2)}</span>
    </div>

    <div class="csec">
      <h3>Boxes — ${enteredCount} of ${n} entered</h3>
      <input class="csearch" id="cBoxSearch" value="${esc(cBoxFilter)}" placeholder="Jump to box # or game name">
      ${rows.map(({b,i})=>{
        const g=st.games[i]||{};
        const prevB=prevBoxes?prevBoxes[i]:null;
        const priceChanged=prevB&&prevB.price!==''&&b.price!==''&&+prevB.price!==+b.price;
        const delta=(!priceChanged&&prevB&&prevB.qty!==''&&b.qty!=='')?(+prevB.qty||0)-(+b.qty||0):null;
        const out=b.qty!==''&&+b.qty===0;
        const name=b.game?b.game:(g.name||'— empty slot —');
        const price=(b.price!==undefined&&b.price!=='')?b.price:(g.price!==''&&g.price!=null?g.price:'');
        return `<div class="cboxrow ${out?'out':''} ${priceChanged?'newbook':''}">
          <span class="no">${i+1}</span>
          <div class="nm"><p class="g">${esc(name)}</p><p class="p">${price?'$'+esc(price):'—'}${priceChanged?' · new book':''}</p></div>
          <input inputmode="numeric" data-ltqty="${i}" data-shift="${si}" data-date="${d}" value="${esc(b.qty)}" placeholder="0">
          <span class="delta" style="color:${priceChanged?'#8A93A1':delta==null?'#8A93A1':delta>0?'#157F3B':delta<0?'#B8860B':'#8A93A1'}">
            ${priceChanged?'new':delta==null?'—':delta===0?'0':(delta>0?'−'+delta:'+'+Math.abs(delta))}</span>
        </div>`;
      }).join('')||'<div style="text-align:center;color:#8A93A1;font-size:12.5px;padding:14px">No boxes match.</div>'}
    </div>`;
}
function logSale(price){
  const st=S(),d=new Date().toISOString().slice(0,10);
  st.sales[d]=st.sales[d]||{};
  st.sales[d][price]=(st.sales[d][price]||0)+1;
  save();toast(`$${price} ticket logged`);
}

let salesCalMonth=null;
function tabSales(st){
  // top cards + calendar are the real dollar figure from Lotto Reporting's shift
  // reconciliation ((Open-Close)+Add+Online), not the counter app's manual ticket taps —
  // the meter math is a hard reconciliation, taps are easy to miss
  st.lotto=st.lotto||{};
  const lottoDays=Object.keys(st.lotto).sort().reverse();
  const soldOn=d=>{const day=st.lotto[d];return day?daySold(day):0};
  const todayStr=new Date().toISOString().slice(0,10);
  const todaySold=soldOn(todayStr);
  const month=todayStr.slice(0,7);
  const moSold=lottoDays.filter(d=>d.startsWith(month)).reduce((a,d)=>a+soldOn(d),0);
  const yrSold=lottoDays.filter(d=>d.startsWith(month.slice(0,4))).reduce((a,d)=>a+soldOn(d),0);

  // scratch-off ticket taps, still shown below in their own per-price table
  const days=Object.keys(st.sales).sort().reverse();
  const sum=obj=>Object.entries(obj||{}).reduce((a,[p,n])=>({t:a.t+n,r:a.r+n*+p}),{t:0,r:0});

  // month-view calendar — each day's lotto revenue at a glance, like a store ledger page
  if(!salesCalMonth)salesCalMonth=month;
  const[cy,cm]=salesCalMonth.split('-').map(Number);
  const nDays=daysInMonth(cy,cm);
  const firstDow=new Date(cy,cm-1,1).getDay();
  const monthLabel=new Date(cy,cm-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const cells=Array(firstDow).fill(null).concat(Array.from({length:nDays},(_,i)=>i+1));
  while(cells.length%7)cells.push(null);
  const mtd=Array.from({length:nDays},(_,i)=>soldOn(`${salesCalMonth}-${String(i+1).padStart(2,'0')}`)).reduce((a,r)=>a+r,0);

  return `<div class="cards">
      <div class="stat"><div class="k">Lotto sold today</div><div class="v" style="color:#157F3B">$${todaySold.toLocaleString()}</div></div>
      <div class="stat"><div class="k">This month</div><div class="v" style="color:#157F3B">$${moSold.toLocaleString()}</div></div>
      <div class="stat"><div class="k">This year</div><div class="v" style="color:#157F3B">$${yrSold.toLocaleString()}</div></div>
      <div class="stat"><div class="k">Scratch-off tickets today</div><div class="v">${sum(st.sales[todayStr]).t}</div></div>
    </div>
    <div class="panel"><div class="ph"><h3>Sales calendar</h3><span class="hint">Lotto revenue per day, from Lotto Reporting — browse any month</span>
      <div class="sp"></div>
      <button class="btn sm" data-calnav="prev">‹ Prev</button>
      <span style="font-weight:800;padding:0 6px;min-width:150px;text-align:center;display:inline-block">${monthLabel}</span>
      <button class="btn sm" data-calnav="next">Next ›</button></div>
      <div class="pb">
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:10px;overflow:hidden">
          ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div style="background:var(--sf-2);padding:8px 4px;text-align:center;font-size:10.5px;font-weight:800;color:var(--ink-3);text-transform:uppercase">${d}</div>`).join('')}
          ${cells.map(d=>{
            if(d==null)return `<div style="background:var(--sf-2);min-height:64px"></div>`;
            const ds=`${salesCalMonth}-${String(d).padStart(2,'0')}`,r=soldOn(ds),isToday=ds===todayStr;
            return `<div style="background:#fff;min-height:64px;padding:7px;${isToday?'box-shadow:inset 0 0 0 2px var(--r);border-radius:2px':''}">
              <div style="font-size:11.5px;font-weight:700;color:var(--ink-3)">${d}</div>
              ${r?`<div style="margin-top:4px;font-size:12.5px;font-weight:800;color:#157F3B">$${r.toLocaleString()}</div>`:''}
            </div>`;
          }).join('')}
        </div>
        <div style="text-align:center;margin-top:14px;padding:11px;background:var(--r-lt);border-radius:10px;font-weight:800;color:var(--r);font-size:14px">
          Sales MTD $${mtd.toLocaleString()}
        </div>
      </div></div>
    <div class="panel"><div class="ph"><h3>Scratch-off tickets by price</h3><span class="hint">Tickets logged from the counter app — separate from the lotto figures above</span>
      <div class="sp"></div><button class="btn sm" id="salesCsv">Export CSV</button></div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th style="width:130px">Date</th>${PRICES.map(p=>`<th class="rno">$${p}</th>`).join('')}<th>Tickets</th><th>Revenue</th></tr></thead>
        <tbody>${days.length?days.map(d=>{const s=sum(st.sales[d]);
          return `<tr><td class="rno">${d}</td>${PRICES.map(p=>`<td class="rno">${st.sales[d][p]||''}</td>`).join('')}
            <td><b>${s.t}</b></td><td style="color:#157F3B"><b>$${s.r}</b></td></tr>`}).join(''):
          `<tr><td colspan="${PRICES.length+3}" style="text-align:center;color:var(--ink-3);padding:26px">No sales logged. Use the counter app's "Log a sale" buttons.</td></tr>`}
        </tbody></table></div></div>`;
}

/* ---------------- Sales Insights: revenue trend + top price tiers ---------------- */
const addDays=(ymd,delta)=>{const[y,m,d]=ymd.split('-').map(Number);return new Date(y,m-1,d+delta).toISOString().slice(0,10)};
const monthKeyOf=(y,m)=>`${y}-${String(m).padStart(2,'0')}`;   // m is 1-indexed
const daysInMonth=(y,m)=>new Date(y,m,0).getDate();
function periodSum(st,fromDate,toDate){
  let t=0,r=0;
  Object.keys(st.sales).forEach(d=>{
    if(d>=fromDate&&d<=toDate)Object.entries(st.sales[d]).forEach(([p,n])=>{t+=n;r+=n*+p});
  });
  return{t,r};
}
const intakeStats=st=>{

/* Lotto machine reconciliation, mirroring the Fina Waxahachie daily sheet exactly:
   OPEN/CLOSE are the machine's meter reading (ticket inventory value) at the start/end
   of the day — it counts DOWN as tickets dispense. ADD covers a fresh roll loaded
   mid-day, ONLINE any online-lotto adjustment. Below that, 38 fixed boxes each hold a
   ticket at some price; QUANTITY is what's left in that box, VALUE = price × qty.
   The 38 box values should sum to CLOSE — that's the over/short check, the same way the
   sheet's own box-total row sits right next to CLOSE for each day.

   A box's PRICE is recorded PER DAY, not once for the whole store — a box is a physical
   dispenser slot, and the ticket loaded into it can change (sell out a $50 roll, load a
   $20 roll in its place). Each day snapshots its own {price, qty} per box, seeded from
   the day before, so swapping a box's ticket only affects today onward: yesterday's

/* ---- box + shift math. A "shift" holds {clerk,open,openAuto,add,online,close,closeAuto,boxes[]};

const boxPrice=i=>+((S().games[i]||{}).price)||0;

   slot price but a swapped-in book keeps the price it was loaded at */
const lottoBoxValue=(sh,i)=>{const b=(sh.boxes||[])[i]||{};const p=(b.price!==undefined&&b.price!=='')?+b.price:boxPrice(i);return (p||0)*(+b.qty||0)};

/* Close auto-fills from the box total unless typed over (closeAuto===false) */
const effClose=sh=>sh.closeAuto===true?lottoBoxTotal(sh):(+sh.close||0);
const lottoSold=sh=>(+sh.open||0)-effClose(sh)+(+sh.add||0)+(+sh.online||0);
const lottoOverShort=sh=>lottoBoxTotal(sh)-effClose(sh);
/* a day rolls its shifts up: Open = first shift's open, Close = last shift's close */
const dayShifts=day=>day&&Array.isArray(day.shifts)?day.shifts:[];
const dayLast=day=>dayShifts(day)[dayShifts(day).length-1];
const dayOpen=day=>{const s=dayShifts(day)[0];return s?(+s.open||0):0};
const dayClose=day=>{const s=dayLast(day);return s?effClose(s):0};
const dayAdd=day=>dayShifts(day).reduce((a,s)=>a+(+s.add||0),0);
const dayOnline=day=>dayShifts(day).reduce((a,s)=>a+(+s.online||0),0);
const daySold=day=>dayShifts(day).reduce((a,s)=>a+lottoSold(s),0);
const dayBoxTotal=day=>{const s=dayLast(day);return s?lottoBoxTotal(s):0};
const dayOverShort=day=>dayShifts(day).reduce((a,s)=>a+lottoOverShort(s),0);
/* every shift across every day, in chronological then shift order */
function lottoTimeline(st){const out=[];Object.keys(st.lotto||{}).sort().forEach(d=>dayShifts(st.lotto[d]).forEach(s=>out.push(s)));return out}
/* one shift's Close is the next shift's Open — across shifts AND across days */
function syncLottoChain(st){const tl=lottoTimeline(st);for(let k=1;k<tl.length;k++){if(tl[k].openAuto!==false)tl[k].open=effClose(tl[k-1]).toFixed(2)}}

const lottoShiftName=(st,i)=>{const nm=((st||S()).view||{}).lottoShiftNames;return (Array.isArray(nm)&&nm[i]&&String(nm[i]).trim())?nm[i]:('Shift '+(i+1))};
const makeShift=()=>({clerk:'',open:'',openAuto:true,add:'',online:'',close:'',closeAuto:true,boxes:Array.from({length:40},(_,i)=>({game:String((S().games[i]||{}).name||''),price:String((S().games[i]||{}).price||''),qty:''})),newBooks:[]});

/* take a freshly fetched catalog: refresh the browse list, and refresh any game already on
   the board IN PLACE — slots, current-ticket counts and hand-typed prizes are never disturbed */
function applyCatalog(st,arr){
  if(!Array.isArray(arr)||!arr.length)return{upd:0};
  TX=arr.map(x=>({
    no:String(x.no??'').trim(),
    name:x.name||'',
    price:+String(x.price??'').replace(/[^0-9.]/g,'')||0,
    img:x.img||'',
    feat:!!x.featured,
    isNew:!!x.new,
    closing:!!x.closing,
    endDate:x.endDate||null,
    prizesLeft:(x.prizesLeft===0||x.prizesLeft)?x.prizesLeft:null
  })).filter(g=>g.no&&g.price);
  let upd=0;
  TX.forEach(g=>{
    const s=st.games.find(y=>String(y.no)===g.no);
    if(!s)return;
    s.name=g.name;s.price=String(g.price);s.img=g.img;
    s.isNew=g.isNew;s.isLucky=g.feat;
    s.closing=!!g.closing;s.endDate=g.endDate||'';
    // the state only ever tells us "zero left"; anything you typed by hand stays
    if(g.prizesLeft!=null)s.prizesLeft=String(g.prizesLeft);
    upd++;
  });
  return{upd};
}
/* swap what's in two slots — the slot numbers stay put, the games trade places */
function swapSlots(st,i,j){
  if(i===j||i<0||j<0||i>39||j>39)return false;
  const a=st.games[i],b=st.games[j];
  st.games[i]=b;st.games[j]=a;
  st.games[i].slot=i+1;st.games[j].slot=j+1;
  return true;
}
/* write a catalog game into a slot the user picked.
   already on the board?  -> the two slots SWAP (a game never lands in two places)
   not on the board yet?  -> it lands in the slot (caller confirms any overwrite) */
function txAssign(st,no,idx){
  const g=TX.find(x=>x.no===no);if(!g||idx==null||idx<0||idx>39)return false;
  const at=st.games.findIndex(x=>String(x.no)===no);
  if(at>=0)return swapSlots(st,at,idx);
  const s=st.games[idx];
  s.no=g.no;s.name=g.name;s.price=String(g.price);s.img=g.img;s.isNew=g.isNew;s.isLucky=g.feat;
  s.closing=!!g.closing;s.endDate=g.endDate||'';
  s.prizesLeft=g.prizesLeft!=null?String(g.prizesLeft):'';
  s.current='';s.status='';
  return true;
}
/* bulk add still fills the open slots in order */
function txAdd(st,no){
  const g=TX.find(x=>x.no===no);if(!g)return false;
  if(st.games.some(x=>String(x.no)===no))return false;
  const slot=st.games.findIndex(x=>!filled(x));if(slot<0)return false;
  return txAssign(st,no,slot);
}
/* a sensible 40: new + featured first, then a spread across price points */
function txAutoFill(st){
  st.games=blankGames();
  const seen=new Set(),pick=[];
  const take=g=>{if(!seen.has(g.no)&&pick.length<40){seen.add(g.no);pick.push(g)}};
  TX.filter(g=>g.isNew).forEach(take);
  TX.filter(g=>g.feat).forEach(take);
  const byPrice={};TX.forEach(g=>{(byPrice[g.price]=byPrice[g.price]||[]).push(g)});
  const prices=Object.keys(byPrice).map(Number).sort((a,b)=>a-b);
  let round=0;
  while(pick.length<40&&round<30){prices.forEach(p=>{const g=byPrice[p][round];if(g)take(g)});round++}
  pick.slice(0,40).forEach((g,i)=>{const s=st.games[i];
    s.no=g.no;s.name=g.name;s.price=String(g.price);s.img=g.img;s.isNew=g.isNew;s.isLucky=g.feat;
    s.closing=!!g.closing;s.endDate=g.endDate||'';
    if(g.prizesLeft!=null)s.prizesLeft=String(g.prizesLeft);});
  return pick.length;
}

    if(el.checked){if(!a.stores.includes(el.value))a.stores.push(el.value)}
    else a.stores=a.stores.filter(x=>x!==el.value);
    save();return;
  }
  if(el.id==='txPrice'){txPrice=el.value;renderAdmin()}
  if(el.dataset.txslot){
    const no=el.dataset.txslot;
    if(el.value===''){return}
    const idx=+el.value,target=st.games[idx];
    const onBoardAt=st.games.findIndex(x=>String(x.no)===no);
    if(onBoardAt<0&&filled(target)){
      if(!confirm(`Slot ${String(target.slot).padStart(2,'0')} already holds "${target.name}".\n\nReplace it with "${TX.find(x=>x.no===no).name}"?`)){renderAdmin();return}
    }
    txAssign(st,no,idx);save();reRender();
    toast(onBoardAt>=0
      ? `Slot ${String(onBoardAt+1).padStart(2,'0')} ↔ ${String(idx+1).padStart(2,'0')}`
      : `#${no} → slot ${String(idx+1).padStart(2,'0')}`);
  }
}

/* connect to the server if we're being served by it */
/* Bring this device online with the server. Throws if the server is unreachable
   (which, on Render's free tier, is exactly what a just-waking server looks like). */
/* Reconcile this device with a freshly fetched server board. The key rule: a real
   board always carries an owner account, while a fresh/wiped server (what Render's
   free tier returns after it sleeps and restarts) carries none. So we never adopt a
   blank board over a real one — we re-seed the server from whichever device still
   has it. This is what keeps the always-on TV from going blank when the server naps. */
function syncFromServer(state,serverRev){
  const serverReal=state&&Array.isArray(state.accounts)&&state.accounts.length>0;
  const weHaveReal=(db.accounts&&db.accounts.length)||(S()&&S().games.some(g=>g.name||g.no));
  if(dirty){rev=serverRev;push();return;}                             // our offline edits win
  if(serverReal){db=normalizeDb(state);rev=serverRev;local.set(db);route();return;}  // adopt live board
  if(weHaveReal){rev=serverRev;dirty=true;push();return;}             // wiped server -> re-seed from us
  if(state){db=normalizeDb(state);rev=serverRev;local.set(db);route();}  // both blank: nothing to lose
}
async function connect(){
  const r=await fetch('/api/state',{cache:'no-store'});
  if(!r.ok)throw 0;
  const j=await r.json();
  SERVED=true;
  syncFromServer(j.state,j.rev||0);
  setLink(true);
  loadDraws();
}
/* If the server is asleep it can take up to a minute to answer, or fail outright.
   Retry through that instead of dropping to local-only on the first miss; if it's
   still down, keep probing in the background so we self-heal the moment it wakes. */
function reconnectLoop(){
  const tick=async()=>{
    if(SERVED)return;
    try{await connect()}catch(e){setLink(false);setTimeout(tick,6000)}
  };
  setTimeout(tick,6000);
}
(async function boot(){
  for(let attempt=0;attempt<10;attempt++){
    try{await connect();return}
    catch(e){setLink(false);await sleep(Math.min(6000,700*(attempt+1)))}
  }
  SERVED=false;setLink(false);route();  // run local-only for now…
  reconnectLoop();                       // …but keep trying to come online
})();

let idle;const wake=()=>{$('#chrome').classList.remove('idle');clearTimeout(idle);
  idle=setTimeout(()=>$('#chrome').classList.add('idle'),3000)};
['mousemove','keydown','touchstart'].forEach(ev=>window.addEventListener(ev,wake));
wake();route();
